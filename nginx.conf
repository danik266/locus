server {
    listen 443 ssl;
    server_name continue.46.101.134.38.sslip.io;
    ssl_certificate /etc/letsencrypt/live/continue.46.101.134.38.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/continue.46.101.134.38.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets (Next.js public folder + _next/static)
    location /_next/static/ {
        alias /var/www/continue/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /universities/ {
        alias /var/www/continue/public/universities/;
        expires 7d;
        access_log off;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name continue.46.101.134.38.sslip.io;
    return 301 https://$host$request_uri;
}
